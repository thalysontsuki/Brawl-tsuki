<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<meta name="description" content="Tsuki PureAir - projeto conceitual de tecnologia para monitoramento e filtragem do ar.">
<title>Tsuki PureAir | Brawl Tsuki</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#06101d;
    color:#fff;
    line-height:1.7;
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:92%;
    max-width:1200px;
    margin:auto;
}

/* =========================================================
   VARIÁVEIS
========================================================= */

:root{
    --bg:#06101d;
    --bg2:#091827;
    --card:#0d1d30;
    --card2:#11263b;
    --line:#203a52;
    --primary:#58e2bc;
    --primary-dark:#2cb995;
    --blue:#5aa7ff;
    --text:#ffffff;
    --muted:#a9bacb;
    --success:#63e6be;
}

/* =========================================================
   FUNDO
========================================================= */

body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    left:-250px;
    top:300px;
    border-radius:50%;
    background:rgba(88,226,188,.04);
    filter:blur(80px);
    pointer-events:none;
    z-index:-1;
}

body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    right:-250px;
    top:900px;
    border-radius:50%;
    background:rgba(90,167,255,.04);
    filter:blur(80px);
    pointer-events:none;
    z-index:-1;
}

/* =========================================================
   HEADER
========================================================= */

header{
    position:sticky;
    top:0;
    z-index:999;
    background:rgba(6,16,29,.92);
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--line);
}

.header{
    min-height:74px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:23px;
    font-weight:900;
    letter-spacing:1px;
    white-space:nowrap;
}

.logo span{
    color:var(--primary);
}

nav{
    display:flex;
    align-items:center;
    gap:5px;
    flex-wrap:wrap;
}

nav a{
    color:#b8c7d6;
    padding:9px 12px;
    border-radius:10px;
    font-size:14px;
    transition:.2s;
}

nav a:hover{
    background:#102439;
    color:var(--primary);
}

.country-link{
    background:var(--primary);
    color:#041a14!important;
    font-weight:bold;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:760px;
    display:flex;
    align-items:center;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 85% 25%,rgba(88,226,188,.15),transparent 28%),
        radial-gradient(circle at 15% 80%,rgba(90,167,255,.09),transparent 30%),
        linear-gradient(135deg,#06101d,#0a1c2d);
}

.hero-grid{
    display:grid;
    grid-template-columns:1.05fr .95fr;
    align-items:center;
    gap:60px;
}

.tag{
    display:inline-block;
    padding:7px 13px;
    border-radius:30px;
    border:1px solid rgba(88,226,188,.35);
    background:rgba(88,226,188,.07);
    color:var(--primary);
    font-size:12px;
    font-weight:bold;
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(45px,7vw,78px);
    line-height:1;
    letter-spacing:-3px;
    margin-bottom:25px;
}

.hero h1 span{
    color:var(--primary);
}

.hero-description{
    color:var(--muted);
    font-size:18px;
    max-width:680px;
    margin-bottom:30px;
}

.buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    border-radius:12px;
    padding:14px 20px;
    font-weight:bold;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
}

.btn-primary{
    background:var(--primary);
    color:#041812;
}

.btn-primary:hover{
    transform:translateY(-3px);
}

.btn-secondary{
    background:#0d1d30;
    border:1px solid var(--line);
    color:white;
}

.btn-secondary:hover{
    border-color:var(--primary);
}

/* =========================================================
   APARELHO
========================================================= */

.device-area{
    min-height:480px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.device{
    width:270px;
    height:390px;
    border-radius:48px;
    background:linear-gradient(145deg,#f4ffff,#aac9cc);
    position:relative;
    box-shadow:
        0 35px 90px rgba(0,0,0,.5),
        inset 0 0 30px rgba(255,255,255,.7);
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-14px);
    }
}

.device-top{
    position:absolute;
    top:18px;
    left:28px;
    right:28px;
    height:43px;
    border-radius:25px;
    background:#d8eeee;
}

.device-screen{
    position:absolute;
    top:88px;
    left:38px;
    right:38px;
    height:100px;
    border-radius:18px;
    background:#061b28;
    border:3px solid #8cb9ba;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.device-screen strong{
    font-size:30px;
    color:var(--primary);
}

.device-screen small{
    color:#c3d4df;
}

.device-grille{
    position:absolute;
    left:42px;
    right:42px;
    bottom:48px;
    height:90px;
    border-radius:17px;
    background:
        repeating-linear-gradient(
            to bottom,
            #819a9d 0px,
            #819a9d 5px,
            transparent 5px,
            transparent 13px
        );
}

.air-wave{
    position:absolute;
    border:1px solid rgba(88,226,188,.4);
    border-radius:50%;
    width:430px;
    height:430px;
    animation:pulse 3s infinite;
}

.air-wave.two{
    width:520px;
    height:520px;
    animation-delay:1s;
}

@keyframes pulse{
    0%{
        opacity:0;
        transform:scale(.7);
    }
    50%{
        opacity:1;
    }
    100%{
        opacity:0;
        transform:scale(1.1);
    }
}

/* =========================================================
   ESTATÍSTICAS
========================================================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-top:-70px;
    position:relative;
    z-index:2;
}

.stat{
    background:#0b1b2c;
    border:1px solid var(--line);
    border-radius:18px;
    padding:23px;
}

.stat small{
    color:#8fa5b9;
}

.stat strong{
    display:block;
    font-size:27px;
    color:var(--primary);
    margin-top:5px;
}

/* =========================================================
   SEÇÕES
========================================================= */

section{
    padding:100px 0;
}

.section-label{
    color:var(--primary);
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:10px;
}

.section-title{
    font-size:42px;
    line-height:1.15;
    margin-bottom:16px;
}

.section-text{
    color:var(--muted);
    max-width:850px;
    margin-bottom:40px;
}

/* =========================================================
   SOBRE
========================================================= */

.about{
    background:#081625;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.about-card{
    background:#0c1c2e;
    border:1px solid var(--line);
    border-radius:22px;
    padding:30px;
}

.about-card h3{
    font-size:25px;
    margin-bottom:14px;
}

.about-card p{
    color:var(--muted);
    margin-bottom:15px;
}

.about-list{
    list-style:none;
}

.about-list li{
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,.05);
    color:#d7e2ec;
}

.about-list li:last-child{
    border-bottom:0;
}

.about-list b{
    color:var(--primary);
    margin-right:7px;
}

/* =========================================================
   VISÃO GERAL
========================================================= */

.overview-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.info-card{
    background:linear-gradient(145deg,#0d1e31,#0a1828);
    border:1px solid var(--line);
    border-radius:20px;
    padding:28px;
    transition:.25s;
}

.info-card:hover{
    transform:translateY(-5px);
    border-color:rgba(88,226,188,.55);
}

.card-icon{
    width:55px;
    height:55px;
    border-radius:15px;
    background:#102b3b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    margin-bottom:17px;
}

.info-card h3{
    font-size:21px;
    margin-bottom:9px;
}

.info-card p{
    color:var(--muted);
}

/* =========================================================
   FUNCIONAMENTO
========================================================= */

.function{
    background:#091827;
}

.steps{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

.step{
    background:#0d1d30;
    border:1px solid var(--line);
    border-radius:20px;
    padding:26px;
}

.step-number{
    color:var(--primary);
    font-size:13px;
    font-weight:bold;
    margin-bottom:13px;
}

.step h3{
    font-size:21px;
    margin-bottom:10px;
}

.step p{
    color:var(--muted);
}

/* =========================================================
   FILTRAGEM
========================================================= */

.filter-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.filter-card{
    background:#0c1c2e;
    border:1px solid var(--line);
    border-radius:20px;
    padding:28px;
    position:relative;
    overflow:hidden;
}

.filter-card::after{
    content:"";
    position:absolute;
    right:-30px;
    bottom:-30px;
    width:100px;
    height:100px;
    border-radius:50%;
    background:rgba(88,226,188,.05);
}

.filter-number{
    font-size:42px;
    color:rgba(88,226,188,.25);
    font-weight:900;
}

.filter-card h3{
    margin-bottom:8px;
}

.filter-card p{
    color:var(--muted);
}

/* =========================================================
   TECNOLOGIA
========================================================= */

.tech{
    background:
        radial-gradient(circle at 80% 20%,rgba(90,167,255,.08),transparent 30%),
        #071421;
}

.tech-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.tech-item{
    padding:28px;
    border:1px solid var(--line);
    border-radius:20px;
    background:#0c1d30;
}

.tech-item h3{
    margin-bottom:9px;
}

.tech-item p{
    color:var(--muted);
}

/* =========================================================
   MODO AUTOMÁTICO
========================================================= */

.auto-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
    align-items:stretch;
}

.auto-panel{
    background:#0c1c2e;
    border:1px solid var(--line);
    border-radius:22px;
    padding:30px;
}

.auto-panel h3{
    font-size:27px;
    margin-bottom:12px;
}

.auto-panel p{
    color:var(--muted);
    margin-bottom:20px;
}

.mode{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px;
    background:#091827;
    border:1px solid var(--line);
    border-radius:14px;
    margin:10px 0;
}

.mode span:first-child{
    color:#d8e4ed;
}

.mode span:last-child{
    color:var(--primary);
    font-weight:bold;
}

/* =========================================================
   PAINEL
========================================================= */

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.metric{
    padding:25px;
    background:#0c1c2e;
    border:1px solid var(--line);
    border-radius:18px;
}

.metric-label{
    color:#8ea4b8;
    font-size:13px;
}

.metric-value{
    color:var(--primary);
    font-size:31px;
    font-weight:900;
    margin:6px 0;
}

.metric-status{
    color:#aebdca;
    font-size:13px;
}

/* =========================================================
   APLICAÇÕES
========================================================= */

.application-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.application{
    padding:28px;
    border-radius:20px;
    background:#0d1d30;
    border:1px solid var(--line);
}

.application h3{
    font-size:22px;
    margin-bottom:9px;
}

.application p{
    color:var(--muted);
}

/* =========================================================
   SUSTENTABILIDADE
========================================================= */

.eco{
    background:#071a1b;
}

.eco-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.eco-card{
    padding:28px;
    background:#0b2020;
    border:1px solid #1d4542;
    border-radius:20px;
}

.eco-card h3{
    margin-bottom:9px;
}

.eco-card p{
    color:#a9c3c0;
}

/* =========================================================
   SEGURANÇA
========================================================= */

.safety-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.safety-card{
    padding:26px;
    border:1px solid var(--line);
    border-radius:20px;
    background:#0d1d30;
}

.safety-card h3{
    margin-bottom:9px;
}

.safety-card p{
    color:var(--muted);
}

/* =========================================================
   FUTURO
========================================================= */

.future{
    background:#091726;
}

.future-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.future-item{
    padding:25px;
    border-left:3px solid var(--primary);
    background:#0d1d30;
    border-radius:0 15px 15px 0;
}

.future-item h3{
    margin-bottom:7px;
}

.future-item p{
    color:var(--muted);
}

/* =========================================================
   CHECKLIST
========================================================= */

.check-section{
    background:#071421;
}

.check-container{
    max-width:850px;
    margin:auto;
}

.check-box{
    background:#0d1d30;
    border:1px solid var(--line);
    border-radius:22px;
    padding:30px;
}

.check-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px 0;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.check-item:last-child{
    border-bottom:0;
}

.check-item input{
    width:19px;
    height:19px;
    accent-color:#58e2bc;
}

.progress{
    height:10px;
    background:#071421;
    border-radius:20px;
    overflow:hidden;
    margin-top:22px;
}

.progress-bar{
    width:0%;
    height:100%;
    background:var(--primary);
    transition:.3s;
}

.progress-text{
    color:var(--muted);
    margin-top:10px;
    font-size:14px;
}

/* =========================================================
   FAQ
========================================================= */

.faq{
    max-width:900px;
    margin:auto;
}

details{
    background:#0d1d30;
    border:1px solid var(--line);
    border-radius:16px;
    padding:19px 21px;
    margin:12px 0;
}

summary{
    cursor:pointer;
    font-weight:bold;
}

details p{
    color:var(--muted);
    margin-top:12px;
}

/* =========================================================
   PROJETO
========================================================= */

.project{
    text-align:center;
    background:
        radial-gradient(circle at 50% 0,rgba(88,226,188,.1),transparent 35%),
        #071421;
}

.project p{
    max-width:780px;
    margin:0 auto 14px;
    color:var(--muted);
}

/* =========================================================
   FOOTER
========================================================= */

footer{
    padding:45px 0;
    background:#040b14;
    border-top:1px solid var(--line);
}

.footer-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.footer-text{
    color:#879bad;
    margin-top:8px;
}

.footer-links{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.footer-links a{
    color:#91a6b8;
}

.footer-links a:hover{
    color:var(--primary);
}

/* =========================================================
   BOTÃO TOPO
========================================================= */

.top{
    position:fixed;
    right:20px;
    bottom:20px;
    width:45px;
    height:45px;
    border-radius:50%;
    border:1px solid var(--line);
    background:#0d1d30;
    color:var(--primary);
    z-index:100;
}

/* =========================================================
   RESPONSIVO
========================================================= */

@media(max-width:1000px){

    .hero-grid{
        grid-template-columns:1fr;
        text-align:center;
    }

    .hero-description{
        margin-left:auto;
        margin-right:auto;
    }

    .buttons{
        justify-content:center;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .steps{
        grid-template-columns:1fr 1fr;
    }

    .dashboard{
        grid-template-columns:1fr 1fr;
    }

    .about-grid{
        grid-template-columns:1fr;
    }

    .overview-grid{
        grid-template-columns:1fr 1fr;
    }

    .filter-grid{
        grid-template-columns:1fr 1fr;
    }

    .eco-grid{
        grid-template-columns:1fr 1fr;
    }

    .safety-grid{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:700px){

    header{
        position:relative;
    }

    .header{
        padding:15px 0;
        flex-direction:column;
    }

    nav{
        justify-content:center;
    }

    nav a{
        font-size:12px;
        padding:7px 8px;
    }

    section{
        padding:70px 0;
    }

    .hero{
        min-height:auto;
        padding:75px 0 110px;
    }

    .hero h1{
        font-size:47px;
    }

    .hero-description{
        font-size:16px;
    }

    .device{
        width:210px;
        height:310px;
    }

    .device-screen{
        top:75px;
        left:30px;
        right:30px;
        height:80px;
    }

    .device-grille{
        left:33px;
        right:33px;
        bottom:35px;
    }

    .air-wave{
        width:320px;
        height:320px;
    }

    .air-wave.two{
        width:390px;
        height:390px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
        margin-top:-45px;
    }

    .stat{
        padding:17px;
    }

    .section-title{
        font-size:32px;
    }

    .overview-grid{
        grid-template-columns:1fr;
    }

    .steps{
        grid-template-columns:1fr;
    }

    .filter-grid{
        grid-template-columns:1fr;
    }

    .tech-grid{
        grid-template-columns:1fr;
    }

    .auto-box{
        grid-template-columns:1fr;
    }

    .dashboard{
        grid-template-columns:1fr 1fr;
    }

    .application-grid{
        grid-template-columns:1fr;
    }

    .eco-grid{
        grid-template-columns:1fr;
    }

    .safety-grid{
        grid-template-columns:1fr;
    }

    .future-list{
        grid-template-columns:1fr;
    }

    .footer-grid{
        grid-template-columns:1fr;
    }

    .footer-links{
        justify-content:flex-start;
    }
}

</style>
</head>
