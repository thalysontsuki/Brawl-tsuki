<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Produtos — Exemplo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Loja Exemplo</h1>
  </header>

  <main class="container">
    <section class="product-grid" id="productGrid">
      <!-- Cards gerados pelo HTML estático abaixo; no seu projeto, gere com loop/JS -->
      <article class="product-card" data-id="1" data-name="Tênis Chuva" data-price="249.90" data-img="https://via.placeholder.com/800x600?text=Tenis+Chuva" data-desc="Tênis confortável, resistente à água. Solado antiderrapante.">
        <img class="product-thumb" src="https://via.placeholder.com/400x300?text=Tenis+Chuva" alt="Tênis Chuva" />
        <div class="product-info">
          <h3 class="product-title">Tênis Chuva</h3>
          <p class="product-price">R$ 249,90</p>
          <button class="btn view-product">Ver produto</button>
        </div>
      </article>

      <article class="product-card" data-id="2" data-name="Mochila Trail" data-price="159.90" data-img="https://via.placeholder.com/800x600?text=Mochila+Trail" data-desc="Mochila resistente com vários compartimentos e suporte lombar.">
        <img class="product-thumb" src="https://via.placeholder.com/400x300?text=Mochila+Trail" alt="Mochila Trail" />
        <div class="product-info">
          <h3 class="product-title">Mochila Trail</h3>
          <p class="product-price">R$ 159,90</p>
          <button class="btn view-product">Ver produto</button>
        </div>
      </article>

      <!-- Adicione mais cards conforme necessário -->
    </section>
  </main>

  <!-- Modal de produto -->
  <div class="modal" id="productModal" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Fechar">✕</button>
      <div class="modal-body">
        <div class="modal-left">
          <img id="modalImage" src="" alt="Imagem do produto" />
          <div class="thumbs" id="modalThumbs"></div>
        </div>
        <div class="modal-right">
          <h2 id="modalTitle">Título do produto</h2>
          <p class="modal-price" id="modalPrice">R$ 0,00</p>
          <p class="modal-desc" id="modalDesc">Descrição do produto</p>

          <div class="options">
            <label>Cor
              <select id="optionColor">
                <option value="preto">Preto</option>
                <option value="branco">Branco</option>
                <option value="azul">Azul</option>
              </select>
            </label>

            <label>Tamanho
              <select id="optionSize">
                <option value="p">P</option>
                <option value="m" selected>M</option>
                <option value="g">G</option>
                <option value="gg">GG</option>
              </select>
            </label>

            <label>Quantidade
              <div class="qty">
                <button id="qtyMinus" class="qty-btn">−</button>
                <input id="qtyInput" type="number" min="1" value="1" />
                <button id="qtyPlus" class="qty-btn">+</button>
              </div>
            </label>
          </div>

          <div class="modal-actions">
            <button class="btn primary" id="addCart">Adicionar ao carrinho</button>
            <button class="btn ghost" id="buyNow">Comprar agora</button>
          </div>

          <details class="more-options">
            <summary>Mais opções e especificações</summary>
            <ul>
              <li>Frete grátis acima de R$199</li>
              <li>Entrega em 3–7 dias úteis</li>
              <li>30 dias de garantia de devolução</li>
            </ul>
          </details>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
